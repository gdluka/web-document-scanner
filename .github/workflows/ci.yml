name: Check and publish scanner
on:
  push:
    branches: [main, experiment/opencv-5]
  pull_request:
permissions:
  contents: read
concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SCANNER_BASE: ${{ github.ref == 'refs/heads/experiment/opencv-5' && '/web-document-scanner/lab/' || '/web-document-scanner/' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/checkout@v6
        if: github.ref == 'refs/heads/experiment/opencv-5'
        with:
          ref: main
          path: stable
      - name: Build stable scanner alongside experimental lab
        if: github.ref == 'refs/heads/experiment/opencv-5'
        working-directory: stable
        env:
          SCANNER_BASE: /web-document-scanner/
        run: |
          npm ci
          npm run build
          mkdir -p dist/lab
          cp -a ../dist/. dist/lab/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: ${{ github.ref == 'refs/heads/experiment/opencv-5' && 'stable/dist' || 'dist' }}
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
